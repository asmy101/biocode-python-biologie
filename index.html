<script>'use strict';
const algoChapters = [
 {
  "id": "algo-concepts",
  "num": "A1",
  "icon": "◇",
  "title": "Qu'est-ce qu'un algorithme ?",
  "short": "Comprendre le problème, identifier les entrées, les traitements et les sorties.",
  "time": "50 min",
  "level": "Initiation",
  "objectives": [
   "Définir un algorithme et le distinguer d’un programme.",
   "Identifier les données d’entrée, le traitement et le résultat attendu.",
   "Décomposer un problème biologique en étapes finies."
  ],
  "sections": [
   {
    "title": "Un algorithme, avant le code",
    "body": "<p>Un <strong>algorithme</strong> est une suite d’instructions <strong>précises</strong>, <strong>ordonnées</strong> et <strong>finies</strong> qui résout un problème. Il peut être décrit en français structuré, avec un organigramme ou en <em>pseudo-code</em>.</p><p>Un <strong>programme</strong> est sa traduction dans un langage de programmation (par exemple Python). L’algorithme décrit <em>quoi faire</em> ; le programme permet à l’ordinateur de l’exécuter.</p><div class=\"info-box\"><strong>Exemple quotidien :</strong> pour préparer une solution : vérifier le matériel → mesurer → mélanger → étiqueter. L’ordre et les conditions comptent.</div>"
   },
   {
    "title": "Entrées → traitement → sorties",
    "body": "<p>Pour chaque problème, poser trois questions : <strong>quelles données reçoit-on ?</strong> <strong>quel calcul fait-on ?</strong> <strong>quel résultat veut-on ?</strong></p><p><strong>Cas biologique :</strong> parmi 40 graines semées, 34 ont germé. On souhaite calculer le taux de germination.</p><table><thead><tr><th>Entrées</th><th>Traitement</th><th>Sortie</th></tr></thead><tbody><tr><td>semées = 40, germées = 34</td><td>(34 / 40) × 100</td><td>85 %</td></tr></tbody></table>",
    "pseudo": "Algorithme TauxGermination\nEntrées : semees, germees\nDébut\n    taux ← (germees / semees) × 100\n    Écrire taux, \"%\"\nFin",
    "note": "Avant de diviser, il faudra vérifier que le nombre de graines semées est strictement positif. Nous apprendrons cette condition au chapitre A3."
   },
   {
    "title": "Comment représenter un algorithme ?",
    "body": "<p>Le <strong>pseudo-code</strong> est une écriture lisible par les humains : les mots <em>Début</em>, <em>Lire</em>, <em>Si</em>, <em>Pour</em> y expriment les actions. Il ne s’exécute pas directement comme un script Python.</p><p>Un <strong>organigramme</strong> décrit visuellement le déroulement : ellipse pour Début/Fin, parallélogramme pour Lire/Écrire, rectangle pour un traitement, losange pour une décision.</p><div class=\"info-box\"><strong>Chaîne de résolution :</strong> Problème → Analyse (entrées/sorties) → Algorithme → Traduction en Python → Tests → Résultat.</div>"
   },
   {
    "title": "Qualités d'une bonne solution",
    "body": "<p>Un algorithme doit avoir des étapes sans ambiguïté, se terminer, être correct pour les entrées prévues et gérer les cas limites. On le vérifie sur des <strong>jeux d’essai</strong> : un cas normal, un cas limite, une entrée invalide.</p><p><strong>À essayer :</strong> avec 10 graines semées et 0 germée, le taux attendu est 0 %. Avec 0 graine semée, le calcul est impossible sans message d’erreur.</p>"
   }
  ],
  "quiz": [
   {
    "q": "Un algorithme doit-il obligatoirement être écrit en Python ?",
    "choices": [
     "Oui",
     "Non",
     "Seulement en biologie"
    ],
    "correct": 1,
    "why": "Le raisonnement algorithmique est indépendant du langage de programmation."
   },
   {
    "q": "Dans l'exemple de germination, quelle est la sortie ?",
    "choices": [
     "34 graines",
     "85 %",
     "40 graines"
    ],
    "correct": 1,
    "why": "Le résultat est le taux de germination calculé à partir des entrées."
   },

 return `<span class="eyebrow">Recherche</span><h1>Résultats pour « ${escapeHtml(term)} »</h1><p>${hits.length} résultat(s) dans les cours, TD et TP.</p>${hits.length?`<div class="search-result-list">${hits.map(h=>`<div class="search-result"><span class="pill">${h.type}</span><h3>${escapeHtml(h.name)}</h3><p>${escapeHtml(h.desc)}</p><a class="code-link" href="#/${h.route}">Ouvrir →</a></div>`).join('')}</div>`:`<div class="empty">Aucun résultat. Essayez par exemple « ADN », « boucle », « pH » ou « fonction ».</div>`}`;
}
function currentPath(){return decodeURIComponent(location.hash.replace(/^#\/?/,'')||'accueil');}
function render(){
 const path=currentPath();const [type,slug]=path.split('/'); let title='BioCode'; let html='';
 if(type==='accueil'){html=home();title='Accueil';}
 else if(type==='cours'&&chapters.some(c=>c.id===slug)){const c=chapters.find(c=>c.id===slug);html=chapterPage(c);title=c.title;}
 else if(type==='td'&&tds.some(t=>t.id===slug)){const t=tds.find(t=>t.id===slug);html=tdPage(t);title=t.title;}
 else if(type==='tp'&&tps.some(t=>t.id===slug)){const t=tps.find(t=>t.id===slug);html=tpPage(t);title=t.title;}
 else if(type==='laboratoire'){html=labPage();title='Mini-laboratoire';}
 else if(type==='recherche'){let term=lastSearch;try{term=sessionStorage.getItem('biocode-last-search')||lastSearch;}catch(e){}html=searchPage(term);title='Recherche';}
 else {html=home();title='Accueil';}
 el('main').innerHTML=html;el('page-title').textContent=title;document.title=title+' — BioCode';renderNav();
 document.querySelectorAll('.nav-link').forEach(btn=>btn.classList.toggle('active',btn.dataset.go===path));
 el('sidebar').classList.remove('open');el('mobile-overlay').classList.remove('show');
 window.scrollTo(0,0);
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...done]));}catch(e){}}
function toast(btn,text){if(!btn)return;const old=btn.textContent;btn.textContent=text;setTimeout(()=>{if(btn.isConnected)btn.textContent=old;},1500);}
async function copyText(text,btn){
 try{await navigator.clipboard.writeText(text);toast(btn,'✓ Copié');}
 catch(e){const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();try{document.execCommand('copy');toast(btn,'✓ Copié');}catch(_){toast(btn,'Sélectionnez le code');}area.remove();}
}
function downloadScript(id){const tp=tps.find(x=>x.id===id);if(!tp)return;const blob=new Blob([tp.code+'\n'],{type:'text/x-python;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=id+'_biologie.py';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function fixed2(n){return n.toLocaleString('fr-FR',{maximumFractionDigits:2});}
function setLabResult(msg,error=false){const e=el('lab-result');if(!e)return;e.classList.toggle('error',error);e.innerHTML=msg;}
function calcLab(id){
 if(id==='adn'){
   const seq=el('lab-adn').value.toUpperCase().replace(/\s/g,'');if(!seq||!/^[ATCG]+$/.test(seq)){setLabResult('⚠ Veuillez saisir une séquence non vide contenant uniquement A, T, C ou G.',true);return;}
   const counts=Object.fromEntries([..."ATCG"].map(b=>[b,seq.split(b).length-1]));const comp=[...seq].map(b=>({A:'T',T:'A',C:'G',G:'C'})[b]).join('');const gc=100*(counts.C+counts.G)/seq.length;
   setLabResult(`<strong>${fixed2(gc)} % GC</strong>Longueur : ${seq.length} bases · A : ${counts.A} · T : ${counts.T} · C : ${counts.C} · G : ${counts.G}<br>Complément : <code class="inline">${comp}</code>`);
 }else if(id==='ph'){
   const raw=el('lab-ph').value;if(raw.trim()===''){setLabResult('⚠ Veuillez renseigner une valeur.',true);return;}
   const p=Number(raw);if(!Number.isFinite(p)){setLabResult('⚠ Valeur numérique invalide.',true);return;}
   if(p<0||p>14){setLabResult('⚠ Valeur hors de la plage pédagogique 0–14. Cette plage simplifiée n’est pas une borne physique universelle.',true);return;}
   const result=p<7?'Acide':p>7?'Basique':'Neutre';setLabResult(`<strong>${result}</strong>Valeur saisie : pH ${fixed2(p)}<br><small>Classification scolaire usuelle à 25 °C.</small>`);
 }else if(id==='croissance'){
   const n=Number(el('lab-pop').value),k=Number(el('lab-etapes').value);if(!Number.isSafeInteger(n)||n<=0||!Number.isInteger(k)||k<0||k>20){setLabResult('⚠ Utilisez une population initiale entière positive et 0 à 20 doublements.',true);return;}
   const result=n*(2**k);if(!Number.isSafeInteger(result)){setLabResult('⚠ Valeur trop grande pour un calcul entier exact dans le navigateur.',true);return;}
   setLabResult(`<strong>${result.toLocaleString('fr-FR')} cellules</strong>${k} doublement(s) depuis ${n.toLocaleString('fr-FR')} cellules<br><small>Modèle idéal : N = N₀ × 2ᵏ, sans limitation de ressources.</small>`);
 }else if(id==='transcription'){
   const seq=el('lab-transcription').value.toUpperCase().replace(/\s/g,'');
   if(!seq||!/^[ATCG]+$/.test(seq)){setLabResult('⚠ Séquence ADN requise : A, T, C et G uniquement.',true);return;}
   setLabResult('<strong>ARNm : '+seq.replace(/T/g,'U')+'</strong>ADN codant (5′→3′) : '+seq+'<br><small>Correspondance du brin codant à l’ARNm (5′→3′).</small>');
 }else if(id==='germination'){
   const a=el('lab-semees').value,b=el('lab-germees').value,s=Number(a),g=Number(b);
   if(!a.trim()||!b.trim()||!Number.isSafeInteger(s)||!Number.isSafeInteger(g)||s<=0||g<0||g>s){setLabResult('⚠ Semées > 0 et 0 ≤ germées ≤ semées ; effectifs entiers requis.',true);return;}
   setLabResult('<strong>'+fixed2(100*g/s)+' %</strong>'+g+' graines germées sur '+s+' semées.');
 }else if(id==='statistiques'){
   const raw=el('lab-mesures').value.trim();if(!raw){setLabResult('⚠ Entrez au moins une mesure.',true);return;}
   const parts=raw.split(';').map(t=>t.trim().replace(',','.'));
   if(parts.length>200||parts.some(t=>!t||!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t))){setLabResult('⚠ Entrez 1 à 200 nombres séparés par des points-virgules.',true);return;}
   const x=parts.map(Number);if(x.some(t=>!Number.isFinite(t))){setLabResult('⚠ Nombre invalide.',true);return;}
   const min=Math.min(...x),max=Math.max(...x),mean=x.reduce((a,b)=>a+b,0)/x.length;
   if(!Number.isFinite(mean)||!Number.isFinite(max-min)){setLabResult('⚠ Nombres trop grands.',true);return;}
   setLabResult('<strong>Moyenne : '+fixed2(mean)+'</strong>'+x.length+' mesure(s) · Min : '+fixed2(min)+' · Max : '+fixed2(max)+'<br>Étendue : '+fixed2(max-min));
 }else if(id==='dilution2'){
   const raw=['lab-c1','lab-c2','lab-v2'].map(k=>el(k).value);const [c1,c2,v2]=raw.map(Number);
   if(raw.some(t=>!t.trim())||![c1,c2,v2].every(Number.isFinite)||c1<=0||c2<=0||v2<=0||c2>c1){setLabResult('⚠ Dilution impossible : 0 < C2 ≤ C1 et V2 > 0.',true);return;}
   const v1=c2*v2/c1;if(!Number.isFinite(v1)||!Number.isFinite(v2-v1)){setLabResult('⚠ Valeurs trop grandes.',true);return;}
   setLabResult('<strong>'+fixed2(v1)+' mL de solution mère</strong>'+fixed2(v2-v1)+' mL de diluant ; volume final : '+fixed2(v2)+' mL.<br><small>C1×V1 = C2×V2 ; volumes supposés additifs.</small>');
 }else if(id==='dilution'){
   const m=Number(el('lab-masse').value),v=Number(el('lab-volume').value);if(el('lab-masse').value===''||el('lab-volume').value===''||!Number.isFinite(m)||!Number.isFinite(v)||m<0||v<=0){setLabResult('⚠ Masse ≥ 0 g et volume strictement positif requis.',true);return;}
   setLabResult(`<strong>${fixed2(m/(v/1000))} g/L</strong>Masse : ${fixed2(m)} g · Volume : ${fixed2(v)} mL<br><small>Conversion : ${fixed2(v/1000)} L ; C = m / V.</small>`);
 }
}

document.addEventListener('click',e=>{
 const go=e.target.closest('[data-go]');if(go){location.hash='/'+go.dataset.go;return;}
 const a=e.target.closest('[data-answer]');if(a){const [id,i,j]=a.dataset.answer.split('|');answers[id+'-'+i]=Number(j);const c=chapters.find(x=>x.id===id);const q=c?.quiz[Number(i)];const wrap=a.closest('.quiz-card');if(q&&wrap){const choices=wrap.querySelectorAll('.choice');choices.forEach((b,idx)=>{b.disabled=true;b.classList.toggle('correct',idx===q.correct);b.classList.toggle('incorrect',idx===Number(j)&&idx!==q.correct)});const div=document.createElement('div');div.className='quiz-result '+(Number(j)===q.correct?'good':'bad');div.textContent=(Number(j)===q.correct?'✓ Bonne réponse. ':'Réponse correcte : '+q.choices[q.correct]+'. ')+q.why;wrap.appendChild(div);}return;}
 const c=e.target.closest('[data-complete]');if(c){const id=c.dataset.complete;if(done.has(id))done.delete(id);else done.add(id);save();renderNav();c.textContent=done.has(id)?'✓ Chapitre terminé · Annuler':'✓ Marquer ce chapitre comme terminé';c.classList.toggle('complete',done.has(id));return;}
 const solution=e.target.closest('[data-solution]');if(solution){const target=el(solution.dataset.solution);if(target){target.hidden=!target.hidden;solution.setAttribute('aria-expanded',String(!target.hidden));solution.textContent=target.hidden?'Afficher le corrigé ▾':'Masquer le corrigé ▴';}return;}
 const copy=e.target.closest('[data-copy]');if(copy){copyText(decodeURIComponent(copy.dataset.copy),copy);return;}
 const download=e.target.closest('[data-download]');if(download){downloadScript(download.dataset.download);return;}
 const tab=e.target.closest('[data-lab]');if(tab){selectedLab=tab.dataset.lab;el('main').innerHTML=labPage();return;}
 const calc=e.target.closest('[data-lab-calc]');if(calc){calcLab(calc.dataset.labCalc);return;}
 const sect=e.target.closest('[data-section]');if(sect){e.preventDefault();el(sect.dataset.section)?.scrollIntoView({behavior:'smooth',block:'start'});return;}
});
function searchSubmit(){const q=el('global-search').value.trim();if(!q)return;lastSearch=q;try{sessionStorage.setItem('biocode-last-search',q);}catch(e){}if(currentPath()==='recherche')render();else location.hash='/recherche';el('global-search').blur();}
el('global-search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchSubmit();}});
el('global-search').addEventListener('input',e=>{if(!e.target.value.trim()&&currentPath()==='recherche'){location.hash='/accueil';}});
el('mobile-menu').addEventListener('click',()=>{el('sidebar').classList.toggle('open');el('mobile-overlay').classList.toggle('show');});
el('mobile-overlay').addEventListener('click',()=>{el('sidebar').classList.remove('open');el('mobile-overlay').classList.remove('show');});
window.addEventListener('hashchange',render);
render();
</script>
