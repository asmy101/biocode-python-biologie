/* Schémas d'algorithmique et atelier de traduction Python */
.data-visual{margin:20px 0;background:#f4f9f5;border:1px solid #d6e6d8;border-radius:16px;padding:19px}.visual-title{font-weight:850;color:#255b49;margin-bottom:12px}
.array-cells{display:flex;gap:7px;flex-wrap:wrap}.array-cells>div{min-width:75px;text-align:center;border:1px solid #b7d9c1;border-radius:10px;background:white;overflow:hidden}
.array-cells span{display:block;background:#e6f1e7;color:#4c796a;font-size:11px;padding:5px}.array-cells b{display:block;padding:12px;color:#1f5949;font-size:20px}
.diagram-note{margin:10px 0 0;font-size:12px}.dict-visual{display:grid;grid-template-columns:max-content 1fr;gap:6px;max-width:360px}.dict-visual span,.dict-visual b{padding:9px 14px;background:#e3f1e9;border-radius:8px;font-size:12px}
.dict-visual b{background:white;border:1px solid #d7e9db}.data-comparison{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin:18px 0}
.data-comparison>div{padding:17px;background:#f3f8f3;border:1px solid #dce9df;border-radius:14px;min-width:0}
.data-comparison h3{font-size:16px;margin:8px 0}.data-comparison p{font-size:12px}.data-comparison code{font-size:11px;overflow-wrap:anywhere}.compare-symbol{font-weight:900;font-size:25px;color:#14705a}

.schema-bridge{border:1px solid #cee3d6;background:linear-gradient(110deg,#f3faf4,#fffaf0);border-radius:19px;padding:22px;margin-top:20px}
.schema-bridge h3{font-size:18px;margin:0 0 6px;color:#194e42}.schema-bridge p{font-size:13px;margin:0 0 17px}
.schema-track{display:flex;align-items:stretch;gap:7px;flex-wrap:wrap;justify-content:space-between}
.schema-step{flex:1 1 125px;min-width:120px;padding:15px 11px;border:1px solid #d6e7da;border-radius:13px;background:#fff;text-align:center}
.schema-step strong{display:block;color:#174d40;font-size:13px}.schema-step span{display:block;color:#647d70;font-size:11px;margin-top:4px}
.schema-arrow{align-self:center;font-weight:900;color:#42846c;font-size:20px}
.schema-bridge .btn{margin-top:18px}
.atelier-grid{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:18px;margin:20px 0}
.atelier-panel{min-width:0;border:1px solid var(--border);border-radius:17px;padding:23px;background:#fff}
.atelier-panel h2{font-size:20px;margin-bottom:12px}
.atelier-panel label{display:block;font-size:12px;color:#426658;font-weight:800;margin:13px 0 5px}
.atelier-panel select,.atelier-panel input{width:100%;padding:11px 12px;border:1px solid #bdd5c6;border-radius:10px;background:#fbfdfb;color:var(--ink)}
.atelier-panel .code-window{margin:8px 0 18px}
.atelier-note{font-size:12px;color:#6b8073}
.atelier-result{border-radius:12px;margin-top:17px;background:#eaf6ee;padding:16px;border:1px solid #c9e5d2;font-size:13px;color:#245e49}
.atelier-result strong{display:block;font-size:20px;color:#164b3f;margin-bottom:4px}
.atelier-result.error{background:#fff0eb;border-color:#ecc7b5;color:#8b452f}
.atelier-flow{margin:18px 0;display:flex;flex-direction:column;align-items:center;gap:7px}
.flow-node{border:1px solid #c5dfce;border-radius:13px;background:white;text-align:center;padding:11px 17px;max-width:min(100%,450px);width:100%;font-size:13px;color:#254b3e;font-weight:700}
.flow-node.terminal{border-radius:40px;background:#dcefe3}
.flow-node.read{background:#f6f7e9}
.flow-node.decision{background:#eee9f9;border-color:#d4c8ee}
.flow-node.process{background:#e7f1fd;border-color:#c2d8ee}
.flow-node.output{background:#e8f7ee}
.flow-down{font-size:19px;color:#528975;line-height:1}
.flow-forks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:670px}
.flow-fork{border:1px dashed #c5dacf;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;align-items:center;background:#f8fbf7}
.flow-fork .flow-node{font-size:12px;flex:1}
.flow-caption{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#41775c;font-weight:900}
.flow-fork.invalid .flow-caption{color:#a36447}
.atelier-examples{display:flex;gap:8px;flex-wrap:wrap}
.atelier-examples span{background:#edf4ee;border:1px solid #d6e6db;padding:9px 12px;border-radius:10px;font-size:12px;color:#425f50}
@media(max-width:900px){.atelier-grid{grid-template-columns:1fr}}
@media(max-width:700px){.schema-track{display:grid;grid-template-columns:1fr;gap:6px}.schema-arrow{justify-self:center;transform:rotate(90deg)}.flow-forks{grid-template-columns:1fr}.atelier-panel{padding:18px}}


/* Simulateur algorithmique pas à pas */

.trace-controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:13px}

.trace-table{width:100%;border-collapse:collapse;font-size:13px}

.trace-table th{color:#557365;font-weight:750}.trace-table td:last-child{font-weight:850;color:#1c614e}
.trace-console{padding:15px 18px;background:#15332e;color:#ebf9e9;border-radius:12px;font-family:Consolas,monospace;min-height:55px;white-space:pre-wrap}
.trace-history{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}

.trace-history tr:last-child{background:#e6f5e9}
.practice-entry{background:linear-gradient(112deg,#e7f5eb,#fff7e9);border:1px solid #d3e7d9;border-radius:16px;padding:21px;margin:18px 0;display:flex;justify-content:space-between;align-items:center;gap:20px}

.practice-links{display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0}

@media(max-width:760px){.trace-panel{padding:17px}.practice-entry{display:block}.practice-links{margin-top:16px}.trace-head select{min-width:0}.trace-history{font-size:11px}}


.print-toolbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px}

}


/* Chapitre 01 - introduction à la bio-informatique */

.bio-pillar>span{font-size:23px;display:block}.bio-pillar strong{font-size:14px;color:#225c4d;display:block;margin:4px 0}.bio-pillar small{font-size:11px;color:#698678;display:block}
.bio-plus{font-size:22px;font-weight:900;align-self:center;color:#5b9276}
.bio-summary{padding:14px 18px;background:#e8f5ec;border:1px solid #cde6d2;border-radius:12px;font-size:13px;margin-bottom:17px;color:#30664d}
.bio-workflow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:16px 0}
.bio-workflow div{flex:1 1 140px;min-width:120px;background:#f4f9f6;border:1px solid #cce0d5;border-radius:12px;padding:15px 13px}

@media(max-width:640px){.bio-impact-grid{grid-template-columns:1fr}.bio-plus,.bio-workflow>b{display:none}.bio-overview,.bio-workflow{display:grid;grid-template-columns:1fr}.bio-pillar,.bio-workflow div{min-width:0}}


.loop-table-scroll{overflow-x:auto;margin:18px 0}
.loop-comparison{width:100%;border-collapse:collapse;min-width:570px;font-size:12px;line-height:1.6}
.loop-comparison th{background:#e4f1e9;color:#214e3e;text-align:left;padding:11px 12px;border-bottom:2px solid #bad8c4}
.loop-comparison td{padding:11px 12px;border-bottom:1px solid #dce9df;vertical-align:top;color:#3c5852}
.loop-comparison tbody tr:nth-child(even){background:#f7faf7}

.loop-compare-grid>div{border:1px solid #d7e7d9;border-radius:12px;padding:13px;background:#f5faf6;min-width:0}
.loop-compare-grid strong{display:block;color:#205840;font-size:13px}
.loop-compare-grid span{display:block;color:#5c7969;font-size:11px;margin:5px 0 10px}
.loop-compare-grid code{display:block;overflow-wrap:anywhere;color:#165f4a;font-size:11px}
@media(max-width:720px){.loop-compare-grid{grid-template-columns:1fr}}


/* A1 : introduction à l'algorithmique */
.a1-steps{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:18px 0}
.a1-steps>div{flex:1 1 125px;background:#edf7f0;border:1px solid #c7e4d3;border-radius:12px;padding:16px 10px;text-align:center;min-width:120px}
.a1-steps small{display:block;color:#638074;font-size:10px}.a1-steps strong,.a1-steps b{display:block;font-size:16px;color:#1e684e}
.a1-steps>span{font-size:23px;color:#398c65}
.a1-two,.a1-three{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:17px 0}
.a1-three{grid-template-columns:repeat(3,minmax(0,1fr))}
.a1-two>div,.a1-three>article{background:#f5faf6;border:1px solid #dae9df;border-radius:12px;padding:15px}
.a1-two strong,.a1-three strong{color:#1c5f47;font-size:14px}
.a1-two p,.a1-three p{font-size:12px;margin:6px 0 0}
.a1-history{display:flex;align-items:center;gap:20px;background:#f4f9f5;border:1px solid #d7e9dc;border-radius:15px;padding:19px;margin:18px 0}
.a1-arabic{min-width:170px;padding:26px 13px;background:#e4f2e7;border-radius:11px;text-align:center;font-size:27px;color:#1b6044;direction:rtl}
.a1-history h3{font-size:16px;color:#245c43}.a1-history p{font-size:13px}
.a1-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:15px 0}
.a1-flow>span{flex:1 1 105px;background:#e6f2e9;border:1px solid #c8e3cd;border-radius:10px;padding:12px;text-align:center;color:#1c6449;font-weight:750;font-size:12px}
.a1-flow>b{color:#468e6c;font-size:19px}
.a1-cylinder{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(220px,1.2fr);gap:15px;align-items:center;background:#f8fcf8;border:1px solid #d2e7dc;border-radius:15px;padding:16px;margin:17px 0}
.a1-cylinder-drawing{text-align:center}.a1-cylinder-drawing svg{display:block;width:100%;max-height:260px}
.a1-cylinder-drawing small{font-size:11px;color:#688677}.a1-cylinder h3{font-size:17px;color:#235b41}
.a1-cylinder p{font-size:13px}
@media(max-width:790px){.a1-three,.a1-two,.a1-cylinder{grid-template-columns:1fr}.a1-history{flex-direction:column}.a1-steps{display:grid;grid-template-columns:1fr}.a1-steps>span{text-align:center;transform:rotate(90deg)}.a1-flow{display:grid;grid-template-columns:1fr}.a1-flow>b{text-align:center;transform:rotate(90deg)}}


/* A1 : représentation des algorithmes (organigramme et pseudo-code) */
.a1-repr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:18px 0}
.a1-repr-card{border:1px solid #d4e6dc;background:#f5faf6;padding:19px;border-radius:15px;min-width:0}
.a1-repr-icon{font-size:27px;color:#246e54;background:#e0f2e6;width:47px;height:47px;display:flex;align-items:center;justify-content:center;border-radius:12px;margin-bottom:12px}
.a1-repr-card h3{font-size:17px;color:#185a42;margin:0 0 8px}
.a1-repr-card p{font-size:13px;line-height:1.65}
.a1-shape-legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}
.a1-shape-legend>div{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.a1-shape-legend small{font-size:11px;color:#557568}
.a1-shape{display:flex;align-items:center;justify-content:center;min-height:58px;min-width:100px;padding:9px 12px;text-align:center;background:#dfefe5;border:2px solid #4b9272;color:#15553f;font-size:12px;font-weight:800}
.a1-shape-round{border-radius:50%}
.a1-shape-process{border-radius:5px}
.a1-shape-diamond{width:78px;min-width:78px;height:78px;transform:rotate(45deg);border-radius:5px;padding:7px}
.a1-shape-diamond span{transform:rotate(-45deg);font-size:11px}
.a1-shape-io{transform:skew(-15deg);min-width:120px}.a1-shape-io span{transform:skew(15deg)}
.a1-org-schema{display:flex;align-items:center;flex-direction:column;gap:5px;background:#f7fbf8;border:1px solid #d4e5dc;border-radius:15px;padding:21px 12px;margin:20px 0}
.a1-org-pill,.a1-org-process,.a1-org-parallelogram{min-width:190px;max-width:95%;text-align:center;padding:12px 17px;border:2px solid #569775;background:#e4f2e8;color:#165941;font-size:13px;font-weight:800}
.a1-org-pill{border-radius:100px}.a1-org-process{border-radius:5px;line-height:1.8}
.a1-org-parallelogram{transform:skew(-14deg);border-radius:3px}
.a1-org-parallelogram span{display:block;transform:skew(14deg)}
.a1-org-arrow{color:#3d946c;font-size:21px;font-weight:800;line-height:1}
@media(max-width:760px){.a1-repr-grid{grid-template-columns:1fr}.a1-shape-legend{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* A2 : les variables, leurs types, leur nommage et les constantes */
.a2-var-box{max-width:400px;margin:20px auto;background:#f5faf6;border:1px solid #cfe4d6;border-radius:15px;padding:17px;text-align:center}
.a2-var-label{font-size:13px;color:#4d7661;margin:8px 0}.a2-var-value{width:150px;min-height:75px;border:3px solid #56a27a;border-radius:12px;background:#e0f2e5;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:850;color:#1a6a4d;margin:auto}
.a2-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.a2-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.a2-grid article{padding:15px;background:#f5faf6;border:1px solid #d5e7db;border-radius:13px;min-width:0}
.a2-grid h3{font-size:15px;color:#24684c;margin:0 0 9px}.a2-grid p{font-size:12px;line-height:1.6;margin:0 0 6px}
.a2-grid code{display:block;font-size:12px;padding:5px 8px;margin:5px 0;border-radius:7px;background:#fff;border:1px solid #e1ede4;overflow-wrap:anywhere}
.a2-rules{display:grid;gap:9px;margin:18px 0}
.a2-rules>div{display:flex;align-items:start;gap:12px;background:#f4f9f5;border:1px solid #d8e9dc;border-radius:11px;padding:12px 14px}
.a2-rules b{flex:0 0 29px;height:29px;background:#d9efe0;color:#175d42;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.a2-rules span{font-size:13px;color:#345b4b}

/* Exercices corrigés de l'algorithmique A2 */
.a2-exercise{background:#f8fbf8;border:1px solid #d5e8da;border-radius:14px;padding:18px;margin:15px 0}
.a2-exercise h3{font-size:17px;margin:0 0 12px;color:#236145}

.a2-formula{background:#e7f3ec;border:1px solid #c4dfce;padding:13px;text-align:center;color:#21583f;font-size:16px;font-weight:750;border-radius:10px;margin:12px 0;overflow-wrap:anywhere}
.a2-correction{margin-top:13px;border:1px solid #c7e4d2;border-radius:10px;background:#fff;overflow:hidden}
.a2-correction summary{cursor:pointer;padding:12px 15px;background:#eaf6ee;color:#1e6448;font-size:13px;font-weight:800}
.a2-correction[open]{padding-bottom:13px}.a2-correction[open]>p,.a2-correction[open]>pre,.a2-correction[open]>div,.a2-correction[open]>table{margin:12px 14px}
.a2-correction pre{overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border-radius:9px;background:#102e28;color:#e8f7ef;font:12px/1.55 Consolas,Monaco,monospace}
@media print{.a2-correction:not([open])>summary{display:none}.a2-correction:not([open]){display:none}}


/* A2 : instructions de base et traces d'affectation */
.a2-instruction-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:19px 0}
.a2-instruction-cards article{border:1px solid #d5e6d9;border-radius:13px;background:#f5faf6;padding:16px;min-width:0}
.a2-instruction-cards article>span{background:#d9eee0;color:#1a6848;border-radius:50%;height:30px;width:30px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:850}

.a2-instruction-cards p{font-size:12px;margin:4px 0}
.a2-instruction-flow,.a2-affect-syntax,.a2-change{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
.a2-instruction-flow span,.a2-affect-syntax span{background:#e7f3e9;border:1px solid #c6e2d1;border-radius:11px;padding:12px 15px;color:#225d45;font-size:13px;font-weight:800;text-align:center}

.a2-example-line{display:grid;grid-template-columns:minmax(160px,.9fr) minmax(0,1.1fr);gap:10px;border-bottom:1px solid #e2efe6;padding:10px 6px;align-items:center;font-size:13px}
.a2-example-line code{font-size:13px;color:#165c41;overflow-wrap:anywhere}.a2-example-line span{color:#4c695b}
.a2-change>div{padding:15px 20px;border:1px solid #c6e1d1;background:#f1f9f3;border-radius:14px;text-align:center;min-width:145px}
.a2-change code{display:block;font-size:17px;color:#215e46;margin-bottom:5px}.a2-change span{display:block;font-size:12px;color:#547667}
.a2-pseudo-exercise{background:#14322c;color:#f2fbf2;border-radius:11px;padding:15px 17px;font:13px/1.7 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.a2-trace-scroll{overflow-x:auto;max-width:100%}
.a2-trace-table{width:100%;border-collapse:collapse;font-size:12px;min-width:390px}
.a2-trace-table th,.a2-trace-table td{border:1px solid #d9e7dc;padding:9px 11px;text-align:center;color:#375847}
.a2-trace-table th{background:#dceee3;font-weight:850}
.a2-trace-table tr:last-child{background:#edf8ee;font-weight:850}
.a2-trace-table td:first-child{text-align:left;font-weight:700}

/* A3 : tableau des mentions */
.a3-mention-table{max-width:100%;overflow-x:auto;margin:15px 0}
.a3-mention-table table{width:100%;border-collapse:collapse;min-width:310px;font-size:13px}
.a3-mention-table th{background:#dff0e5;color:#235b44;font-weight:800}

.a4-for-syntax>span{font-weight:850;color:#1c7350}.a4-for-syntax>strong{color:#184c38;background:#e2f1e8;padding:5px 10px;border-radius:6px}
.a4-for-body{flex-basis:100%;border-left:3px solid #5a9e76;padding:10px 13px;color:#245f47;font-size:13px;margin-left:20px}

.a4-trace-scroll{max-width:100%;overflow-x:auto}
.a4-trace{width:100%;border-collapse:collapse;font-size:12px;min-width:295px}
.a4-trace td,.a4-trace th{border:1px solid #cfded4;padding:9px 10px;text-align:left}
.a4-trace th{background:#e1efe5;color:#1c5c43}.a4-trace tbody tr:nth-child(even){background:#f6faf7}

   {
    "title": "Nommage des variables : règles à respecter",
    "body": "<p>Le <strong>nom d'une variable</strong> est un identificateur. Dans les exemples de ce module, nous choisissons des noms lisibles avec lettres, chiffres et caractère <code class=\"inline\">_</code> (<em>underscore</em>).</p><div class=\"a2-rules\"><div><b>1</b><span>Commencer par une lettre ou <code>_</code>, jamais par un chiffre.</span></div><div><b>2</b><span>Ne pas mettre d'espaces ni de caractères tels que <code>-</code> ou <code>!</code>.</span></div><div><b>3</b><span>Éviter les mots-clés réservés : <code>if</code>, <code>for</code>, <code>class</code>…</span></div><div><b>4</b><span>Choisir un nom explicite : <code>taux_germination</code> plutôt que <code>x1</code>.</span></div></div><div class=\"a2-grid\"><article><h3>✓ Exemples valides</h3><code>nb_graines</code><code>lot2</code><code>temperature</code><code>_masse</code></article><article><h3>✕ Exemples invalides</h3><code>2lots</code><code>nb graines</code><code>taux-germination</code><code>for</code></article></div><p>Python distingue <code class=\"inline\">Masse</code> et <code class=\"inline\">masse</code>. Certains identificateurs Unicode sont possibles, mais pour débuter nous privilégions les caractères non accentués.</p>",

   {
    "title": "Les types : Entier, Réel, Chaîne et Booléen",
    "body": "<p>Le <strong>type</strong> indique la nature de la donnée. Pour commencer, distinguons quatre types de base et leurs équivalents Python :</p><div class=\"a2-grid\"><article><h3>Entier · int</h3><p>Nombres sans décimales : <code>-1</code>, <code>0</code>, <code>100</code>. Exemple : effectif des graines.</p></article><article><h3>Réel · float</h3><p>Valeurs décimales : <code>0.12</code>, <code>10.46</code>, <code>-13.5</code>. Exemple : température.</p></article><article><h3>Chaîne · str</h3><p>Texte : <code>\"ATGC\"</code>, <code>\"Olivier\"</code>. Exemple : séquence ADN.</p></article><article><h3>Booléen · bool</h3><p>Valeurs logiques <code>True</code> et <code>False</code>. Exemple : graine germée ou non.</p></article></div><div class=\"info-box\"><strong>Attention :</strong> en Python, les booléens s'écrivent <code class=\"inline\">True</code> et <code class=\"inline\">False</code>. On les traite ici comme des valeurs logiques, et pas comme de simples chiffres 1 et 0.</div>",

    "title": "Les constantes : valeurs fixes pendant l'algorithme",
    "body": "<p>Une <strong>constante</strong> est une valeur que l'on choisit de ne pas modifier pendant l'algorithme. Dans notre pseudo-code, elle reçoit une valeur dès sa déclaration.</p><p>Par convention, les noms des constantes sont écrits <strong>en majuscules</strong> : <code class=\"inline\">PI</code>, <code class=\"inline\">MAXI</code>, <code class=\"inline\">SEUIL</code>.</p><div class=\"a2-grid\"><article><h3>Variable</h3><p>Valeur susceptible de changer :</p><code>rayon ← 10</code><code>rayon ← 12</code></article><article><h3>Constante</h3><p>Valeur conservée pendant le calcul :</p><code>PI = 3.14</code><code>MAXI = 32</code></article></div><div class=\"info-box\"><strong>En Python :</strong> écrire <code class=\"inline\">PI = 3.14</code> est une convention de nommage ; Python ne rend pas automatiquement cette valeur non modifiable. On s'engage à ne pas la réaffecter.</div>",

   {
    "title": "Les instructions de base : affectation, lecture et écriture",
    "body": "<p>Les <strong>instructions de base</strong> sont les opérations élémentaires d’un algorithme. Avant les tests et les boucles, il faut apprendre à <strong>affecter</strong> des valeurs, <strong>lire</strong> des données et <strong>écrire</strong> des résultats.</p><div class=\"a2-instruction-cards\"><article><span>1</span><h3>Affectation</h3><p><code>A ← 5</code></p><p>Donner une valeur à une variable.</p></article><article><span>2</span><h3>Entrée / Lecture</h3><p><code>Lire A</code></p><p>Recevoir une valeur donnée par l’utilisateur.</p></article><article><span>3</span><h3>Sortie / Écriture</h3><p><code>Écrire A</code></p><p>Afficher un message ou un résultat.</p></article></div><div class=\"a2-instruction-flow\"><span>Lire les données</span><b>→</b><span>Calculer / Affecter</span><b>→</b><span>Écrire le résultat</span></div>"

    "title": "L’affectation : définition, syntaxe et exemples",
    "body": "<p><strong>L’affectation</strong> donne à une variable la valeur obtenue par l’évaluation d’une expression. En pseudo-code, nous utilisons le symbole <strong>←</strong>, dirigé vers la variable qui reçoit le résultat.</p><div class=\"a2-affect-syntax\"><span>Variable</span><strong>←</strong><span>Expression</span></div><p>On calcule d’abord l’expression située <strong>à droite</strong>, puis on affecte son résultat à la variable <strong>à gauche</strong>. En Python, on utilise <code class=\"inline\">=</code> pour l’affectation.</p><div class=\"a2-example-line\"><code>A ← 5</code><span>A prend la valeur 5</span></div><div class=\"a2-example-line\"><code>B ← 5 + 4</code><span>B prend la valeur 9</span></div><div class=\"a2-example-line\"><code>C ← 6 × 2 × (10 + 4)</code><span>C prend la valeur 168</span></div><div class=\"a2-example-line\"><code>D ← A + B</code><span>D prend la valeur 14</span></div><div class=\"a2-example-line\"><code>E ← A × B + C</code><span>E prend la valeur 213</span></div><div class=\"info-box\"><strong>À retenir :</strong> on écrit <code class=\"inline\">A ← 4</code> en pseudo-code et <code class=\"inline\">A = 4</code> en Python. Le symbole <code class=\"inline\">==</code> en Python sert à comparer, pas à affecter.</div>",
    "pseudo": "Algorithme Affectations\nVariables\n    A, B, C, D, E : Entier\nDébut\n    A ← 5\n    B ← 5 + 4\n    C ← 6 × 2 × (10 + 4)\n    D ← A + B\n    E ← A × B + C\n    Écrire A, B, C, D, E\nFin",
    "code": "A = 5\nB = 5 + 4\nC = 6 * 2 * (10 + 4)\nD = A + B\nE = A * B + C\nprint(A, B, C, D, E)",
    "output": "5 9 168 14 213"

   {
    "title": "Affectation : remplacement et évolution des valeurs",
    "body": "<p><strong>Remarque 1 — Remplacement :</strong> lorsqu’on affecte une nouvelle valeur à une variable simple, la valeur précédente n’est plus celle associée à ce nom.</p><div class=\"a2-change\"><div><code>A ← 4</code><span>Valeur de A : 4</span></div><strong>→</strong><div><code>A ← 10</code><span>Valeur de A : 10</span></div></div><p><strong>Remarque 2 — Les valeurs changent au fil des instructions :</strong> une variable déjà calculée ne se recalcule pas automatiquement si une autre variable change.</p><div class=\"a2-affect-syntax\"><span>A = 4</span><span>B = 10</span><span>C = 12</span></div><p>On exécute successivement <code class=\"inline\">A ← 4</code>, <code class=\"inline\">B ← 8</code>, <code class=\"inline\">C ← A + B</code>, puis <code class=\"inline\">B ← 10</code>. Au final <strong>C reste 12</strong>, même si B vaut maintenant 10.</p><div class=\"info-box\"><strong>Précision :</strong> cette représentation « case mémoire » est adaptée aux valeurs numériques simples du cours. En Python, les noms peuvent également référencer des objets mutables : on abordera ce cas plus tard avec les listes.</div>",

   {
    "title": "Exercices d’application après les variables : moyennes et surfaces",
    "body": "<p>Appliquer la méthode <strong>Problème → Entrées → Traitement → Sortie → Algorithme</strong>. Les corrigés sont masqués au départ : essayez de résoudre les exercices avant de les afficher.</p>\n<div class=\"a2-exercise\">\n<h3>Exercice 1 — Moyenne pondérée de deux notes</h3>\n<p><strong>Problème :</strong> calculer la moyenne de deux notes <code>N1</code> et <code>N2</code> ayant des coefficients <code>C1</code> et <code>C2</code> différents.</p>\n<div class=\"a2-formula\">M = (N1 × C1 + N2 × C2) / (C1 + C2)</div>\n<p><strong>Travail demandé :</strong> identifier les entrées, la sortie et le traitement, puis écrire un algorithme complet avec les instructions de lecture et d'affichage.</p>\n<details class=\"a2-correction\"><summary>Afficher le corrigé — Exercice 1</summary>\n<p><strong>Entrées :</strong> N1, N2 : Réel ; C1, C2 : Entier. <strong>Sortie :</strong> M : Réel. Il faut vérifier que la somme des coefficients est positive.</p>\n<pre>Algorithme MoyennePonderee\nVariables\n    N1, N2, M : Réel\n    C1, C2 : Entier\nDébut\n    Lire N1, N2, C1, C2\n    Si C1 &lt; 0 OU C2 &lt; 0 OU C1 + C2 = 0 Alors\n        Écrire \"Coefficients invalides\"\n    Sinon\n        M ← (N1 × C1 + N2 × C2) / (C1 + C2)\n        Écrire M\n    FinSi\nFin</pre>\n<p><strong>Test :</strong> N1 = 12, C1 = 2, N2 = 16, C2 = 3 → M = <strong>14,4</strong>.</p></details>\n</div>\n<div class=\"a2-exercise\">\n<h3>Exercice 2 — Surface d’un rectangle</h3>\n<p><strong>Problème :</strong> calculer la surface d'un rectangle connaissant sa longueur <code>L</code> et sa largeur <code>R</code>.</p>\n<div class=\"a2-formula\">S = L × R</div>\n<p><strong>Travail demandé :</strong> identifier les données et écrire un algorithme qui lit les dimensions, calcule la surface et l'affiche.</p>\n<details class=\"a2-correction\"><summary>Afficher le corrigé — Exercice 2</summary>\n<p><strong>Entrées :</strong> L et R (Réel) ; <strong>traitement :</strong> L × l ; <strong>sortie :</strong> S (Réel).</p>\n<pre>Algorithme SurfaceRectangle\nVariables\n    L, R, S : Réel\nDébut\n    Lire L, R\n    Si L &lt;= 0 OU R &lt;= 0 Alors\n        Écrire \"Dimensions invalides\"\n    Sinon\n        S ← L × R\n        Écrire S\n    FinSi\nFin</pre>\n<p><strong>Test :</strong> L = 8 et R = 5 → S = <strong>40 unités²</strong>.</p></details>\n</div>\n<div class=\"a2-exercise\">\n<h3>Exercice 3 — Concentration massique (application biologique)</h3>\n<p>Un échantillon contient une masse de soluté <code>m</code> exprimée en grammes et un volume <code>Vml</code> exprimé en millilitres. Écrire l'algorithme qui calcule la concentration en g/L.</p>\n<p><strong>Indice :</strong> 1 L = 1 000 mL.</p>\n<details class=\"a2-correction\"><summary>Afficher le corrigé — Exercice 3</summary>\n<pre>Algorithme Concentration\nVariables\n    m, Vml, Vl, C : Réel\nDébut\n    Lire m, Vml\n    Si Vml &lt;= 0 Alors\n        Écrire \"Volume invalide\"\n    Sinon\n        Vl ← Vml / 1000\n        C ← m / Vl\n        Écrire C\n    FinSi\nFin</pre>\n<p><strong>Test :</strong> m = 5 g et Vml = 250 mL → Vl = 0,25 L → C = <strong>20 g/L</strong>.</p></details>\n</div>",
    "note": "Pour calculer une moyenne pondérée, ne pas oublier le dénominateur C1 + C2 ; pour une surface, préciser les unités au carré ; pour une concentration, convertir les mL en L."

   {
    "title": "Exercices d’affectation : valeurs finales et tableaux de trace",
    "body": "<p>Pour ces exercices, exécuter <strong>les affectations dans l’ordre</strong>. Dans un tableau de trace, le signe <strong>—</strong> signifie que la variable n’a pas encore reçu de valeur.</p>\n<div class=\"a2-exercise\">\n<h3>Exercice 1 — Trouver les valeurs finales de a, b et c</h3>\n<pre class=\"a2-pseudo-exercise\">a ← 1\nb ← 5\nc ← a − b\na ← 2\nc ← a + b</pre>\n<p><strong>Question :</strong> quelles sont les valeurs finales de <code>a</code>, <code>b</code> et <code>c</code> ?</p>\n<details class=\"a2-correction\"><summary>Afficher le corrigé et la trace — Exercice 1</summary><div class=\"a2-trace-scroll\"><table class=\"a2-trace-table\"><thead><tr><th>Instruction</th><th>A / a</th><th>B / b</th><th>C / c</th></tr></thead><tbody><tr><td><code>a ← 1</code></td><td>1</td><td>—</td><td>—</td></tr><tr><td><code>b ← 5</code></td><td>1</td><td>5</td><td>—</td></tr><tr><td><code>c ← a − b</code></td><td>1</td><td>5</td><td>-4</td></tr><tr><td><code>a ← 2</code></td><td>2</td><td>5</td><td>-4</td></tr><tr><td><code>c ← a + b</code></td><td>2</td><td>5</td><td>7</td></tr></tbody></table></div><p><strong>Résultat final :</strong> a = <strong>2</strong>, b = <strong>5</strong>, c = <strong>7</strong>. L’ancienne valeur de c (−4) a été remplacée par 7.</p></details>\n</div>\n<div class=\"a2-exercise\">\n<h3>Exercice 2 — Compléter le tableau de trace</h3>\n<pre class=\"a2-pseudo-exercise\">A ← 2\nB ← 6\nC ← A + B\nC ← C + 1\nA ← C\nB ← B + C</pre>\n<p><strong>Travail demandé :</strong> compléter les colonnes A, B et C après chaque instruction, puis donner leurs valeurs finales.</p>\n<details class=\"a2-correction\"><summary>Afficher le corrigé et la trace — Exercice 2</summary><div class=\"a2-trace-scroll\"><table class=\"a2-trace-table\"><thead><tr><th>Instruction</th><th>A / a</th><th>B / b</th><th>C / c</th></tr></thead><tbody><tr><td><code>A ← 2</code></td><td>2</td><td>—</td><td>—</td></tr><tr><td><code>B ← 6</code></td><td>2</td><td>6</td><td>—</td></tr><tr><td><code>C ← A + B</code></td><td>2</td><td>6</td><td>8</td></tr><tr><td><code>C ← C + 1</code></td><td>2</td><td>6</td><td>9</td></tr><tr><td><code>A ← C</code></td><td>9</td><td>6</td><td>9</td></tr><tr><td><code>B ← B + C</code></td><td>9</td><td>15</td><td>9</td></tr></tbody></table></div><p><strong>Résultat final :</strong> A = <strong>9</strong>, B = <strong>15</strong>, C = <strong>9</strong>.</p></details>\n</div>\n<div class=\"a2-exercise\">\n<h3>Exercice 3 — Division entière et modulo</h3>\n<p><strong>Rappel :</strong> <code class=\"inline\">div</code> donne le quotient entier (pour ces entiers positifs), <code class=\"inline\">mod</code> donne le reste.</p>\n<pre class=\"a2-pseudo-exercise\">A ← 2\nB ← A + 1\nC ← B div 3\nC ← C + 1\nA ← A mod 2\nB ← B mod 10</pre>\n<p><strong>Travail demandé :</strong> compléter le tableau de trace et donner A, B et C à la fin.</p>\n<details class=\"a2-correction\"><summary>Afficher le corrigé et la trace — Exercice 3</summary><div class=\"a2-trace-scroll\"><table class=\"a2-trace-table\"><thead><tr><th>Instruction</th><th>A / a</th><th>B / b</th><th>C / c</th></tr></thead><tbody><tr><td><code>A ← 2</code></td><td>2</td><td>—</td><td>—</td></tr><tr><td><code>B ← A + 1</code></td><td>2</td><td>3</td><td>—</td></tr><tr><td><code>C ← B div 3</code></td><td>2</td><td>3</td><td>1</td></tr><tr><td><code>C ← C + 1</code></td><td>2</td><td>3</td><td>2</td></tr><tr><td><code>A ← A mod 2</code></td><td>0</td><td>3</td><td>2</td></tr><tr><td><code>B ← B mod 10</code></td><td>0</td><td>3</td><td>2</td></tr></tbody></table></div><p><strong>Résultat final :</strong> A = <strong>0</strong>, B = <strong>3</strong>, C = <strong>2</strong>.</p><p><code>3 div 3 = 1</code>, <code>2 mod 2 = 0</code>, <code>3 mod 10 = 3</code>. En Python, on utilise <code>//</code> pour le quotient entier et <code>%</code> pour le reste.</p></details>\n</div>\n<div class=\"info-box\"><strong>Pour s’entraîner en autonomie :</strong> vous pouvez aussi utiliser le <a href=\"#/simulateur\">Simulateur pas à pas</a> du site pour observer les valeurs après chaque affectation.</div>",

    "title": "Pourquoi une condition ?",
    "body": "<p>Une condition permet d’effectuer des instructions <strong>uniquement si un test est vérifié</strong>. Le résultat du test est vrai ou faux.</p><p>Dans notre pseudo-code pédagogique, on écrit <em>Si ... Alors ... Sinon ... FinSi</em>. En Python, on utilise <code class=\"inline\">if</code>, <code class=\"inline\">elif</code>, <code class=\"inline\">else</code> et l’indentation.</p>",

   {
    "title": "Exemple 6 — Moyenne de trois notes et mention (condition multiple)",
    "body": "<div class=\"a2-exercise\"><h3>Exercice 6 — Calculer une moyenne et attribuer une mention</h3>\n<p><strong>Problème :</strong> écrire un algorithme qui demande à l’utilisateur de saisir <strong>trois notes entre 0 et 20</strong>, calcule leur moyenne arithmétique, l’affiche et détermine la <strong>mention</strong> correspondante.</p>\n<div class=\"a2-formula\">moyenne = (note1 + note2 + note3) / 3</div>\n<p><strong>Critères de classement :</strong></p>\n<div class=\"a3-mention-table\"><table><thead><tr><th>Intervalle de la moyenne</th><th>Mention</th></tr></thead><tbody>\n<tr><td>0 ≤ moyenne &lt; 10</td><td>Insuffisant</td></tr>\n<tr><td>10 ≤ moyenne &lt; 12</td><td>Passable</td></tr>\n<tr><td>12 ≤ moyenne &lt; 14</td><td>Assez bien</td></tr>\n<tr><td>14 ≤ moyenne &lt; 16</td><td>Bien</td></tr>\n<tr><td>16 ≤ moyenne ≤ 20</td><td>Très bien</td></tr>\n</tbody></table></div>\n<p><strong>Travail demandé :</strong> identifier les entrées et les sorties, déclarer les variables, puis utiliser une <strong>structure conditionnelle multiple</strong> (<em>Si / Sinon Si / Sinon / FinSi</em>). Tester les seuils 10, 12, 14 et 16.</p>\n<details class=\"a2-correction\"><summary>Afficher le corrigé — Algorithme en pseudo-code</summary>\n<p><strong>Entrées :</strong> note1, note2, note3 (Réel). <strong>Sorties :</strong> moyenne (Réel), mention (Chaîne).</p>\n<pre>Algorithme Mention\nVariables\n    note1, note2, note3, moyenne : Réel\n    mention : Chaîne\nDébut\n    Écrire \"Entrez la première note :\"\n    Lire note1\n    Écrire \"Entrez la deuxième note :\"\n    Lire note2\n    Écrire \"Entrez la troisième note :\"\n    Lire note3\n\n    Si note1 &lt; 0 OU note1 > 20 OU\n       note2 &lt; 0 OU note2 > 20 OU\n       note3 &lt; 0 OU note3 > 20 Alors\n        Écrire \"Notes invalides\"\n    Sinon\n        moyenne ← (note1 + note2 + note3) / 3\n\n        Si moyenne &lt; 10 Alors\n            mention ← \"Insuffisant\"\n        Sinon Si moyenne &lt; 12 Alors\n            mention ← \"Passable\"\n        Sinon Si moyenne &lt; 14 Alors\n            mention ← \"Assez bien\"\n        Sinon Si moyenne &lt; 16 Alors\n            mention ← \"Bien\"\n        Sinon\n            mention ← \"Très bien\"\n        FinSi\n\n        Écrire \"La moyenne est :\", moyenne\n        Écrire \"La mention est :\", mention\n    FinSi\nFin</pre>\n<p><strong>Remarque :</strong> le test de validité des notes (0 à 20) est une amélioration ajoutée au pseudo-code des diapositives pour éviter les entrées hors intervalle.</p></details>\n<details class=\"a2-correction\"><summary>Afficher la traduction en Python</summary>\n<pre>note1 = float(input(\"Première note : \"))\nnote2 = float(input(\"Deuxième note : \"))\nnote3 = float(input(\"Troisième note : \"))\n\nif not all(0 &lt;= n &lt;= 20 for n in (note1, note2, note3)):\n    print(\"Notes invalides\")\nelse:\n    moyenne = (note1 + note2 + note3) / 3\n    if moyenne &lt; 10:\n        mention = \"Insuffisant\"\n    elif moyenne &lt; 12:\n        mention = \"Passable\"\n    elif moyenne &lt; 14:\n        mention = \"Assez bien\"\n    elif moyenne &lt; 16:\n        mention = \"Bien\"\n    else:\n        mention = \"Très bien\"\n\n    print(\"La moyenne est :\", round(moyenne, 2))\n    print(\"La mention est :\", mention)</pre>\n<p>Cette version suppose des saisies numériques. La gestion des entrées non numériques avec <code>try/except</code> est une amélioration possible.</p></details>\n<details class=\"a2-correction\"><summary>Afficher des jeux d’essai et leurs résultats</summary>\n<div class=\"a3-mention-table\"><table><thead><tr><th>Notes</th><th>Moyenne</th><th>Mention</th></tr></thead><tbody>\n<tr><td>8, 9, 10</td><td>9</td><td>Insuffisant</td></tr>\n<tr><td>10, 10, 10</td><td>10</td><td>Passable</td></tr>\n<tr><td>12, 12, 12</td><td>12</td><td>Assez bien</td></tr>\n<tr><td>14, 14, 14</td><td>14</td><td>Bien</td></tr>\n<tr><td>16, 16, 16</td><td>16</td><td>Très bien</td></tr>\n<tr><td>18, 15, 15</td><td>16</td><td>Très bien</td></tr>\n<tr><td>22, 12, 13</td><td>—</td><td>Notes invalides</td></tr>\n</tbody></table></div>\n<p>Les conditions sont vérifiées dans l'ordre ; par exemple, une moyenne égale à 12 ne vérifie pas <code>moyenne &lt; 12</code> et passe donc à la branche « Assez bien ».</p></details>\n</div>",

   {
    "title": "Comparaison : Pour, TantQue et Répéter…Jusqu'à",
    "body": "<p>Les trois boucles permettent de <strong>répéter des instructions</strong>, mais elles ne testent pas leur condition au même moment. Pour choisir la bonne structure, on se demande : <em>connaît-on le nombre de répétitions ?</em> et <em>faut-il exécuter le traitement au moins une fois ?</em></p>\n<div class=\"loop-table-scroll\"><table class=\"loop-comparison\"><thead><tr><th>Boucle</th><th>Quand l'utiliser ?</th><th>Test de la condition</th><th>Nombre d'exécutions</th></tr></thead><tbody>\n<tr><td><strong>Pour (for)</strong></td><td>Nombre de répétitions connu ou parcours d'une collection (4 échantillons, bases ADN).</td><td>Progression par compteur ou éléments.</td><td>Peut être <strong>0</strong> si la collection est vide.</td></tr>\n<tr><td><strong>TantQue (while)</strong></td><td>Nombre de répétitions inconnu ; répéter <strong>tant que</strong> la condition est vraie.</td><td><strong>Avant</strong> chaque itération.</td><td><strong>0 ou plus</strong>.</td></tr>\n<tr><td><strong>Répéter…Jusqu'à</strong></td><td>Faire au moins un essai puis recommencer <strong>jusqu'à ce que</strong> la condition devienne vraie.</td><td><strong>Après</strong> chaque itération.</td><td><strong>Au moins 1</strong>.</td></tr></tbody></table></div>\n<div class=\"loop-compare-grid\"><div><strong>Pour</strong><span>Compter ou parcourir</span><code>Pour i de 1 à 4 Faire</code></div><div><strong>TantQue</strong><span>Continuer si vrai</span><code>TantQue condition Faire</code></div><div><strong>Répéter…Jusqu'à</strong><span>Arrêter si vrai</span><code>Répéter … Jusqu'à condition</code></div></div>\n<div class=\"info-box\"><strong>Distinction essentielle :</strong> <em>TantQue</em> continue quand sa condition est <strong>vraie</strong> ; <em>Répéter…Jusqu'à</em> s'arrête quand sa condition devient <strong>vraie</strong>. En Python, il n'existe pas d'instruction native <code class=\"inline\">repeat...until</code> : on utilise généralement <code class=\"inline\">while True</code> avec <code class=\"inline\">break</code>.</div>"

height=\"50\" rx=\"7\" fill=\"#deefe4\" stroke=\"#397c5d\" stroke-width=\"2\"/><text x=\"405\" y=\"292\" text-anchor=\"middle\" font-size=\"17\" fill=\"#1e5540\">Instructions</text>\n<path d=\"M405 311 V340\" fill=\"none\" stroke=\"#3c8a6b\" stroke-width=\"3\" marker-end=\"url(#a4-arrow)\"/>\n<rect x=\"300\" y=\"343\" width=\"210\" height=\"48\" rx=\"7\" fill=\"#deefe4\" stroke=\"#397c5d\" stroke-width=\"2\"/><text x=\"405\" y=\"372\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1e5540\">compteur ← compteur + 1</text>\n<path d=\"M300 367 H200 V162 H252\" fill=\"none\" stroke=\"#3c8a6b\" stroke-width=\"3\" marker-end=\"url(#a4-arrow)\"/>\n<path d=\"M558 162 H660 V396\" fill=\"none\" stroke=\"#3c8a6b\" stroke-width=\"3\" marker-end=\"url(#a4-arrow)\"/><text x=\"577\" y=\"145\" font-size=\"14\" fill=\"#23664b\">Faux</text>\n<rect x=\"580\" y=\"402\" width=\"160\" height=\"36\" rx=\"18\" fill=\"#f5eee2\" stroke=\"#a18a67\" stroke-width=\"2\"/><text x=\"660\" y=\"426\" text-anchor=\"middle\" font-size=\"16\" fill=\"#63513a\" font-weight=\"bold\">FinPour</text>\n</svg></div>\n<div class=\"a4-side-by-side\"><article><h3>Le compteur sert à…</h3><p>1. <strong>Contrôler</strong> le nombre de répétitions.</p><p>2. <strong>Participer</strong> aux calculs ou servir d’indice dans un tableau.</p></article><article><h3>Traduction en Python</h3><pre class=\"a4-pseudo\">for i in range(VI, VF + 1):\n    # instructions\n    pass</pre><p>En Python, la borne finale de <code>range()</code> est <strong>exclue</strong> : d'où <code>VF + 1</code>.</p></article></div>"

function computeAtelier(){
 const get=id=>document.getElementById('atelier-'+id)?.value.trim()||'';
 let pseudo='',python='',message='',isError=false,tests='';
 if(atelierCurrent==='germination'){
  const sr=get('semees'),gr=get('germees'),ss=Number(sr),gg=Number(gr);
  const valid=sr!==''&&gr!==''&&Number.isSafeInteger(ss)&&Number.isSafeInteger(gg)&&ss>0&&gg>=0&&gg<=ss;
  pseudo='Algorithme Germination\nDébut\n  Lire semees, germees\n  Si semees <= 0 OU germees < 0 OU germees > semees Alors\n    Écrire "Effectifs invalides"\n  Sinon\n    taux ← 100 × germees / semees\n    Écrire taux, "%"\n  FinSi\nFin';
  python='semees = int(input("Graines semées : "))\ngermees = int(input("Graines germées : "))\nif semees <= 0 or germees < 0 or germees > semees:\n    print("Effectifs invalides")\nelse:\n    taux = 100 * germees / semees\n    print(round(taux, 2), "%")';
  tests='40 semées, 34 germées → 85 % · 10, 0 → 0 % · 10, 15 → entrée invalide';
  if(valid)message='Résultat : '+(100*gg/ss).toLocaleString('fr-FR',{maximumFractionDigits:2})+' % de germination.';
  else{isError=true;message='Entrées invalides : il faut 0 < semées et 0 ≤ germées ≤ semées (entiers).';}
 }else if(atelierCurrent==='ph'){

  pseudo='Algorithme ClassifierPH\nDébut\n  Lire pH\n  Si pH < 0 OU pH > 14 Alors\n    Écrire "Valeur invalide"\n  Sinon Si pH < 7 Alors\n    Écrire "Acide"\n  Sinon Si pH = 7 Alors\n    Écrire "Neutre"\n  Sinon\n    Écrire "Basique"\n  FinSi\nFin';
  python='ph = float(input("pH : "))\nif ph < 0 or ph > 14:\n    print("Valeur invalide")\nelif ph < 7:\n    print("Acide")\nelif ph == 7:\n    print("Neutre")\nelse:\n    print("Basique")';
  tests='pH 6,5 → acide · pH 7 → neutre · pH 8 → basique · pH −1 → hors plage pédagogique';
  if(valid)message='pH '+p.toLocaleString('fr-FR')+' : '+(p<7?'acide':p>7?'basique':'neutre')+' (convention scolaire à 25 °C).';
  else{isError=true;message='Valeur non valide pour la plage pédagogique 0–14.';}
 }else{
  const raw=get('temperatures'),parts=raw.split(';').map(x=>x.trim().replace(',','.'));

  python='texte = input("Mesures séparées par ; : ")\nmesures = [float(x.strip().replace(",", ".")) for x in texte.split(";") if x.strip()]\nif not mesures:\n    print("Liste vide")\nelse:\n    somme = 0\n    for x in mesures:\n        somme += x\n    print(somme / len(mesures))';
  tests='18;20;22;24 → moyenne 21 °C · 5 → moyenne 5 °C · liste vide → erreur';
  if(valid&&Number.isFinite(avg))message='Moyenne : '+avg.toLocaleString('fr-FR',{maximumFractionDigits:2})+' °C ('+vals.length+' mesure(s)).';
  else{isError=true;message='Liste invalide. Saisissez 1 à 100 valeurs séparées par ;';}
 }
 document.getElementById('atelier-pseudo').innerHTML=codeWindow(pseudo,'pseudo-code.txt');
 document.getElementById('atelier-python').innerHTML=codeWindow(python,'exemple.py');

 const out=document.getElementById('atelier-result');out.textContent=message;out.classList.toggle('error',isError);

function exerciseNormalize(code){
 return String(code).split('\n').map(line=>line.replace(/#.*$/,'')).join('\n');
}
function assessExercise(id){
 const e=translationExercises.find(x=>x.id===id);if(!e)return false;
 const elCode=el('practice-'+id);if(!elCode)return false;
 const code=exerciseNormalize(elCode.value);
 practiceAnswers[id]=elCode.value;
 const items=e.checks.map(([regexp,name])=>({ok:regexp.test(code),name}));
 const correct=items.every(x=>x.ok);
 const f=el('feedback-'+id);
 f.className='practice-feedback'+(correct?'':' error');
 f.innerHTML='<strong>'+(correct?'✓ Tous les éléments attendus sont repérés.':'Critères à revoir :')+'</strong><div style="margin-top:6px">'+items.map(x=>'<div>'+(x.ok?'✓ ':'◻ ')+escapeHtml(x.name)+'</div>').join('')+'</div><p style="font-size:12px;margin:8px 0 0">Vérification indicative : testez aussi le code dans un environnement Python.</p>';
 return correct;
}
function evaluatePractice(){
 let score=0;for(const e of translationExercises){if(assessExercise(e.id))score++;}
 practiceScore=score;el('practice-score').textContent='Score indicatif : '+score+'/6 exercices avec tous les critères reconnus.';
}

function fixed2(n){return n.toLocaleString('fr-FR',{maximumFractionDigits:2});}
function setLabResult(msg,error=false){const e=el('lab-result');if(!e)return;e.classList.toggle('error',error);e.innerHTML=msg;}
function calcLab(id){
 if(id==='adn'){
   const seq=el('lab-adn').value.toUpperCase().replace(/\s/g,'');if(!seq||!/^[ATCG]+$/.test(seq)){setLabResult('⚠ Veuillez saisir une séquence non vide contenant uniquement A, T, C ou G.',true);return;}
   const counts=Object.fromEntries([..."ATCG"].map(b=>[b,seq.split(b).length-1]));const comp=[...seq].map(b=>({A:'T',T:'A',C:'G',G:'C'})[b]).join('');const gc=100*(counts.C+counts.G)/seq.length;
   setLabResult(`<strong>${fixed2(gc)} % GC</strong>Longueur : ${seq.length} bases · A : ${counts.A} · T : ${counts.T} · C : ${counts.C} · G : ${counts.G}<br>Complément : <code class="inline">${comp}</code>`);
 }else if(id==='ph'){
   const raw=el('lab-ph').value;if(raw.trim()===''){setLabResult('⚠ Veuillez renseigner une valeur.',true);return;}
   const p=Number(raw);if(!Number.isFinite(p)){setLabResult('⚠ Valeur numérique invalide.',true);return;}
   if(p<0||p>14){setLabResult('⚠ Valeur hors de la plage pédagogique 0–14. Cette plage simplifiée n’est pas une borne physique universelle.',true);return;}
   const result=p<7?'Acide':p>7?'Basique':'Neutre';setLabResult(`<strong>${result}</strong>Valeur saisie : pH ${fixed2(p)}<br><small>Classification scolaire usuelle à 25 °C.</small>`);
 }else if(id==='croissance'){
   const n=Number(el('lab-pop').value),k=Number(el('lab-etapes').value);if(!Number.isSafeInteger(n)||n<=0||!Number.isInteger(k)||k<0||k>20){setLabResult('⚠ Utilisez une population initiale entière positive et 0 à 20 doublements.',true);return;}
   const result=n*(2**k);if(!Number.isSafeInteger(result)){setLabResult('⚠ Valeur trop grande pour un calcul entier exact dans le navigateur.',true);return;}
   setLabResult(`<strong>${result.toLocaleString('fr-FR')} cellules</strong>${k} doublement(s) depuis ${n.toLocaleString('fr-FR')} cellules<br><small>Modèle idéal : N = N₀ × 2ᵏ, sans limitation de ressources.</small>`);
 }else if(id==='transcription'){
   const seq=el('lab-transcription').value.toUpperCase().replace(/\s/g,'');
   if(!seq||!/^[ATCG]+$/.test(seq)){setLabResult('⚠ Séquence ADN requise : A, T, C et G uniquement.',true);return;}
   setLabResult('<strong>ARNm : '+seq.replace(/T/g,'U')+'</strong>ADN codant (5′→3′) : '+seq+'<br><small>Correspondance du brin codant à l’ARNm (5′→3′).</small>');
 }else if(id==='germination'){
   const a=el('lab-semees').value,b=el('lab-germees').value,s=Number(a),g=Number(b);
   if(!a.trim()||!b.trim()||!Number.isSafeInteger(s)||!Number.isSafeInteger(g)||s<=0||g<0||g>s){setLabResult('⚠ Semées > 0 et 0 ≤ germées ≤ semées ; effectifs entiers requis.',true);return;}
   setLabResult('<strong>'+fixed2(100*g/s)+' %</strong>'+g+' graines germées sur '+s+' semées.');
 }else if(id==='statistiques'){
   const raw=el('lab-mesures').value.trim();if(!raw){setLabResult('⚠ Entrez au moins une mesure.',true);return;}
   const parts=raw.split(';').map(t=>t.trim().replace(',','.'));
   if(parts.length>200||parts.some(t=>!t||!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t))){setLabResult('⚠ Entrez 1 à 200 nombres séparés par des points-virgules.',true);return;}
   const x=parts.map(Number);if(x.some(t=>!Number.isFinite(t))){setLabResult('⚠ Nombre invalide.',true);return;}
   const min=Math.min(...x),max=Math.max(...x),mean=x.reduce((a,b)=>a+b,0)/x.length;
   if(!Number.isFinite(mean)||!Number.isFinite(max-min)){setLabResult('⚠ Nombres trop grands.',true);return;}
   setLabResult('<strong>Moyenne : '+fixed2(mean)+'</strong>'+x.length+' mesure(s) · Min : '+fixed2(min)+' · Max : '+fixed2(max)+'<br>Étendue : '+fixed2(max-min));
 }else if(id==='dilution2'){
   const raw=['lab-c1','lab-c2','lab-v2'].map(k=>el(k).value);const [c1,c2,v2]=raw.map(Number);
   if(raw.some(t=>!t.trim())||![c1,c2,v2].every(Number.isFinite)||c1<=0||c2<=0||v2<=0||c2>c1){setLabResult('⚠ Dilution impossible : 0 < C2 ≤ C1 et V2 > 0.',true);return;}
   const v1=c2*v2/c1;if(!Number.isFinite(v1)||!Number.isFinite(v2-v1)){setLabResult('⚠ Valeurs trop grandes.',true);return;}
   setLabResult('<strong>'+fixed2(v1)+' mL de solution mère</strong>'+fixed2(v2-v1)+' mL de diluant ; volume final : '+fixed2(v2)+' mL.<br><small>C1×V1 = C2×V2 ; volumes supposés additifs.</small>');
 }else if(id==='dilution'){
   const m=Number(el('lab-masse').value),v=Number(el('lab-volume').value);if(el('lab-masse').value===''||el('lab-volume').value===''||!Number.isFinite(m)||!Number.isFinite(v)||m<0||v<=0){setLabResult('⚠ Masse ≥ 0 g et volume strictement positif requis.',true);return;}
   setLabResult(`<strong>${fixed2(m/(v/1000))} g/L</strong>Masse : ${fixed2(m)} g · Volume : ${fixed2(v)} mL<br><small>Conversion : ${fixed2(v/1000)} L ; C = m / V.</small>`);
 }
}

document.addEventListener('click',e=>{
 const pr=e.target.closest('[data-print-mode]');if(pr){document.body.classList.toggle('teacher-print',pr.dataset.printMode==='teacher');window.print();return;}
 const examSubmit=e.target.closest('#exam-submit');if(examSubmit){submitExam();return;}
 const examReset=e.target.closest('#exam-reset');if(examReset){examSelections={};examSubmitted=false;el('main').innerHTML=examPage();return;}
 const printCourse=e.target.closest('#print-course');if(printCourse){window.print();return;}
 const graded=e.target.closest('#practice-grade');if(graded){evaluatePractice();return;}
 const check=e.target.closest('[data-practice-check]');if(check){assessExercise(check.dataset.practiceCheck);return;}
 const hint=e.target.closest('[data-practice-hint]');if(hint){showPracticeHint(hint.dataset.practiceHint);return;}
 const sol=e.target.closest('[data-practice-solution]');if(sol){const id=sol.dataset.practiceSolution;const box=el('solution-'+id);if(box){box.hidden=!box.hidden;if(box.hidden)practiceRevealed.delete(id);else practiceRevealed.add(id);sol.textContent=box.hidden?'Afficher le corrigé':'Masquer le corrigé';}return;}
 const trace=e.target.closest('#trace-next, #trace-prev, #trace-reset');if(trace){const d=simulatorCatalog[simulatorCurrent];if(trace.id==='trace-next')simulatorStep=Math.min(d.states.length-1,simulatorStep+1);else if(trace.id==='trace-prev')simulatorStep=Math.max(0,simulatorStep-1);else simulatorStep=0;updateSimulator();return;}
 const run=e.target.closest('#atelier-run');if(run){computeAtelier();return;}
 const go=e.target.closest('[data-go]');if(go){location.hash='/'+go.dataset.go;return;}
 const a=e.target.closest('[data-answer]');if(a){const [id,i,j]=a.dataset.answer.split('|');answers[id+'-'+i]=Number(j);const c=allChapters.find(x=>x.id===id);const q=c?.quiz[Number(i)];const wrap=a.closest('.quiz-card');if(q&&wrap){const choices=wrap.querySelectorAll('.choice');choices.forEach((b,idx)=>{b.disabled=true;b.classList.toggle('correct',idx===q.correct);b.classList.toggle('incorrect',idx===Number(j)&&idx!==q.correct)});const div=document.createElement('div');div.className='quiz-result '+(Number(j)===q.correct?'good':'bad');div.textContent=(Number(j)===q.correct?'✓ Bonne réponse. ':'Réponse correcte : '+q.choices[q.correct]+'. ')+q.why;wrap.appendChild(div);}return;}
 const c=e.target.closest('[data-complete]');if(c){const id=c.dataset.complete;if(done.has(id))done.delete(id);else done.add(id);save();renderNav();c.textContent=done.has(id)?'✓ Chapitre terminé · Annuler':'✓ Marquer ce chapitre comme terminé';c.classList.toggle('complete',done.has(id));return;}
 const solution=e.target.closest('[data-solution]');if(solution){const target=el(solution.dataset.solution);if(target){target.hidden=!target.hidden;solution.setAttribute('aria-expanded',String(!target.hidden));solution.textContent=target.hidden?'Afficher le corrigé ▾':'Masquer le corrigé ▴';}return;}
 const copy=e.target.closest('[data-copy]');if(copy){copyText(decodeURIComponent(copy.dataset.copy),copy);return;}
 const download=e.target.closest('[data-download]');if(download){downloadScript(download.dataset.download);return;}
 const tab=e.target.closest('[data-lab]');if(tab){selectedLab=tab.dataset.lab;el('main').innerHTML=labPage();return;}
 const calc=e.target.closest('[data-lab-calc]');if(calc){calcLab(calc.dataset.labCalc);return;}
 const sect=e.target.closest('[data-section]');if(sect){e.preventDefault();el(sect.dataset.section)?.scrollIntoView({behavior:'smooth',block:'start'});return;}
});
function searchSubmit(){const q=el('global-search').value.trim();if(!q)return;lastSearch=q;try{sessionStorage.setItem('biocode-last-search',q);}catch(e){}if(currentPath()==='recherche')render();else location.hash='/recherche';el('global-search').blur();}
document.addEventListener('change',e=>{if(e.target.dataset.examQuestion!==undefined&&!examSubmitted){examSelections[Number(e.target.dataset.examQuestion)]=Number(e.target.value);return;}if(e.target.id==='trace-choice'&&simulatorCatalog[e.target.value]){simulatorCurrent=e.target.value;simulatorStep=0;el('main').innerHTML=simulatorPage();updateSimulator();return;}if(e.target.id==='atelier-case'&&atelierCases[e.target.value]){atelierCurrent=e.target.value;el('main').innerHTML=atelierPage();computeAtelier();}});
el('global-search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchSubmit();}});
el('global-search').addEventListener('input',e=>{if(!e.target.value.trim()&&currentPath()==='recherche'){location.hash='/accueil';}});
el('mobile-menu').addEventListener('click',()=>{el('sidebar').classList.toggle('open');el('mobile-overlay').classList.toggle('show');});
el('mobile-overlay').addEventListener('click',()=>{el('sidebar').classList.remove('open');el('mobile-overlay').classList.remove('show');});
window.addEventListener('afterprint',()=>document.body.classList.remove('teacher-print'));
window.addEventListener('hashchange',render);
render();
</script>
